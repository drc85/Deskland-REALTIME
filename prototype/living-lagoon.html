<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lagoon Islands</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#214753}#art{position:fixed;inset:0;width:100%;height:100%;display:block}#ghosts{position:fixed;inset:0;pointer-events:none;z-index:2}.ghost{position:absolute;display:flex;align-items:center;flex-direction:column;padding:5px}.ghost i{display:block;width:42px;height:42px;background:rgba(255,255,255,.55);border:1px solid #ffffff66;border-radius:9px;box-shadow:0 2px 4px #0002}.ghost b{margin-top:5px;display:block;width:48px;height:5px;border-radius:3px;background:#ffffffbb}#nogl{position:fixed;inset:0;place-content:center;color:white;font:16px system-ui;background:#19313b}#nogl:not([hidden]){display:grid}</style></head>
<body data-design="lagoon"><canvas id="art" aria-label="Lagoon Islands"></canvas><div id="ghosts"></div><div id="nogl" hidden>WebGL2 is required to display this design.</div>
<script src="living-sun.js"></script><script src="living-designs.js"></script><script src="living-icon-shadows.js"></script><script src="share.js"></script></body></html>
